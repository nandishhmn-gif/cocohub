name: Deploy to GitHub Pages (docs folder)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and commit docs
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gives the workflow permission to push to the repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Prepare CNAME for custom domain (if provided)
        run: |
          set -e
          mkdir -p dist
          # If repository has a CNAME file at the repo root, copy it into the build output
          if [ -f CNAME ]; then
            echo "Found repo-root CNAME; copying to dist/CNAME"
            cp CNAME dist/CNAME
          fi
          # If a secret CUSTOM_DOMAIN is provided and no repo CNAME exists, write it
          if [ -n "${{ secrets.CUSTOM_DOMAIN }}" ] && [ ! -f dist/CNAME ]; then
            echo "Writing custom domain from secret CUSTOM_DOMAIN to dist/CNAME"
            echo "${{ secrets.CUSTOM_DOMAIN }}" > dist/CNAME
          fi

      - name: Commit docs directory
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f docs  # Force add the docs directory
          git commit -m "chore: update built files" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
