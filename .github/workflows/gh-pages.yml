name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Prepare CNAME for custom domain (if provided)
        run: |
          set -e
          # If repository has a CNAME file at the repo root, copy it into the build output
          if [ -f CNAME ]; then
            echo "Found repo-root CNAME; copying to dist/CNAME"
            mkdir -p dist
            cp CNAME dist/CNAME
          elif [ -n "${{ secrets.CUSTOM_DOMAIN }}" ]; then
            echo "Writing custom domain from secret CUSTOM_DOMAIN to dist/CNAME"
            mkdir -p dist
            echo "${{ secrets.CUSTOM_DOMAIN }}" > dist/CNAME
          else
            echo "No CNAME found and CUSTOM_DOMAIN secret missing — skipping CNAME creation"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
