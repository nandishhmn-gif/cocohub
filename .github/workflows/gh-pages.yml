name: Deploy to GitHub Pages (via gh-pages branch)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Prepare CNAME for custom domain (if provided)
        run: |
          set -e
          mkdir -p dist
          # If repository has a CNAME file at the repo root, copy it into the build output
          if [ -f CNAME ]; then
            echo "Found repo-root CNAME; copying to dist/CNAME"
            cp CNAME dist/CNAME
          fi
          # If a secret CUSTOM_DOMAIN is provided and no repo CNAME exists, write it
          if [ -n "${{ secrets.CUSTOM_DOMAIN }}" ] && [ ! -f dist/CNAME ]; then
            echo "Writing custom domain from secret CUSTOM_DOMAIN to dist/CNAME"
            echo "${{ secrets.CUSTOM_DOMAIN }}" > dist/CNAME
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # optional: set the committer name/email for the push
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
